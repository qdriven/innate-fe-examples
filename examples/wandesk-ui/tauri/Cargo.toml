[package]
name = "wandesk-ui"
version = "0.1.0"
description = "Wandesk UI — standalone desktop app with mock data"
authors = []
edition = "2021"

[lib]
name = "wandesk_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
