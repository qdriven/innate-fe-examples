name: Deploy to GitHub Pages

# 用 innate-fe-cli 把静态示例组装进 webshell，再发到 GitHub Pages。
# 框架仓从 GitHub checkout（默认 variableway/innate-fe，可用仓库变量 FE_REPO 覆盖）。
# 需要服务端的示例不进这次构建：admin-nextjs、skel-lean-ui、sqlite-admin。
on:
  push:
    branches: [main, master]
    paths:
      - "examples/**"
      - "plugins.registry.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout examples
        uses: actions/checkout@v5
        with:
          path: examples-src

      - name: Checkout innate-fe
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.FE_REPO || 'variableway/innate-fe' }}
          token: ${{ secrets.FE_TEMPLATES_TOKEN || secrets.INNATE_FE_TOKEN || github.token }}
          ref: ${{ vars.FE_REF || 'main' }}
          path: innate-fe

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: innate-fe/pnpm-lock.yaml

      # CLI 的仓库根是带 plugins.registry.yaml 和 shells/webshell 的框架仓。
      # 把本仓 examples 与选包清单盖上去，再按 pages profile 组装。
      - name: Overlay examples into the framework workspace
        env:
          PAGES_BASE: /${{ github.event.repository.name }}
        run: |
          rm -rf innate-fe/examples
          mkdir -p innate-fe/examples
          cp -a examples-src/examples/. innate-fe/examples/
          cp examples-src/plugins.registry.yaml innate-fe/plugins.registry.yaml
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs"
          const base = process.env.PAGES_BASE.replace(/\/$/, "")
          function patch(rel, iframeSrc) {
            const file = `innate-fe/examples/${rel}/plugin.json`
            const data = JSON.parse(readFileSync(file, "utf8"))
            data.iframeSrc = iframeSrc
            data.origins = ["self"]
            writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`)
            console.log(`${rel} iframeSrc ${iframeSrc}`)
          }
          patch("web-showcase", `${base}/plugins/web-showcase/index.html`)
          patch("wandesk-ui", `${base}/plugins/wandesk-ui/index.html`)
          const workspaceFile = "innate-fe/pnpm-workspace.yaml"
          const workspace = readFileSync(workspaceFile, "utf8")
          const members = [
            "examples/admin-tanstack",
            "examples/order-admin",
            "examples/feed",
            "examples/making",
            "examples/cheatsheets",
            "examples/awesome",
            "examples/web-showcase",
            "examples/wandesk-ui",
          ]
          const missing = members.filter((m) => !workspace.includes(`"${m}"`))
          if (missing.length > 0) {
            const block = missing.map((m) => `  - "${m}"`).join("\n")
            const next = workspace.replace(
              /packages:\n/,
              `packages:\n${block}\n`
            )
            if (next === workspace) {
              throw new Error("pnpm-workspace.yaml 没有 packages: 段，无法加入示例")
            }
            writeFileSync(workspaceFile, next)
            console.log(`workspace members added: ${missing.join(", ")}`)
          }
          const routerFile = "innate-fe/shells/webshell/src/router.tsx"
          const router = readFileSync(routerFile, "utf8")
          if (!router.includes("basepath:")) {
            const next = router.replace(
              "return createRouter({\n    routeTree,\n    history: options.history,\n  })",
              "return createRouter({\n    routeTree,\n    history: options.history,\n    basepath: import.meta.env.BASE_URL.replace(/\\/$/, \"\") || \"/\",\n  })"
            )
            if (next === router) {
              throw new Error("webshell router.tsx 没有预期的 createRouter 调用，无法注入 basepath")
            }
            writeFileSync(routerFile, next)
            console.log("injected router basepath from import.meta.env.BASE_URL")
          }
          JS

      - name: Install and assemble with innate-fe-cli
        working-directory: innate-fe
        env:
          PUBLIC_PATH: /${{ github.event.repository.name }}/
          PLUGIN_BASE_PATH: /${{ github.event.repository.name }}/plugins/web-showcase
        run: |
          pnpm install --no-frozen-lockfile
          # 当前 CLI 按 profile 的 from 直接链接 domains/<id>。
          # 旧版 CLI 会整份复制并丢掉 node_modules，下面只对那种拷贝改成链接。
          bun innate-fe-cli/src/index.ts gen --profile pages
          for dir in domains/*; do
            [ -e "$dir/.innate-packaging.json" ] || continue
            id=$(basename "$dir")
            [ -d "examples/$id" ] || continue
            rm -rf "$dir"
            ln -s "../examples/$id" "domains/$id"
            echo "linked domains/$id -> examples/$id"
          done
          bun innate-fe-cli/src/index.ts prepare --profile pages
          bun innate-fe-cli/src/index.ts build --profile pages
          bun innate-fe-cli/src/index.ts assemble --profile pages
          cp deploy/index.html deploy/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: innate-fe/deploy

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
