# innate.web-plugin.packaging.v1
# 选包事实源：profile 决定这次 build 带哪些 domain / iframe。
#
# 本仓的示例应用都在 examples/ 下，profile 里的 `from` 一律指向 examples/。
# @innate/* 包与宿主壳 shells/webshell 由 innate-fe 框架仓提供——
# `scan` / `gen` / `verify-flags` 在本仓可跑；`dev` / `build` / `assemble` /
# `all` / `preview` 需要框架的壳与 CLI，见 README「构建方式」。
#
# 约定：
# - domain：源码在 `from` 指定的目录，gen 时链接到 `domains/<id>`（打包面）；
# - iframe：清单来自 `from` 指定目录下的 plugin.json（innate.plugin.v1）。
protocol: innate.web-plugin.packaging.v1
version: 1
defaultProfile: examples-all
# 宿主壳在框架仓（本仓只有 public/plugins 静态产物）。`shell:` 相对 repo
# root 解析，指到框架壳后，gen 接缝与 dev 的 `pnpm --filter @innate/webshell`
# （workspace glob 拉进来的框架壳包）落到**同一份壳**——否则 gen 写本仓
# shells/webshell、vite 跑框架壳，接缝错位出现 "0 plugins"。
# 框架壳 vite.config 的 linkedRoots 已放行本仓（server.fs.allow）。
shell: ../../framework/innate-fe/shells/webshell

profiles:
  # ── UC1 空壳 ───────────────────────────────────────────────
  empty:
    domains: []
    iframes: []

  # ── 大满贯（默认）：全部项目一键启动 ────────────────────────
  # 6 domain（壳内编译）+ 2 静态 iframe + 2 live iframe。
  # `pnpm dev` 缺省即本 profile：live iframe（skel-lean-ui :4011 /
  # admin-nextjs :4012）由 dev plan 按 plugin.json 的本机 iframeSrc
  # 自动拉起 `pnpm --filter <id> dev`；静态 iframe 缺产物时自动
  # prepare（跑各自 build）。要空壳调试接缝时显式 `pnpm dev empty`。
  examples-all:
    domains:
      - id: admin-tanstack
        from: examples/admin-tanstack
      - id: order-admin
        from: examples/order-admin
      - id: making
        from: examples/making
      - id: awesome
        from: examples/awesome
      - id: sqlite-admin
        from: examples/sqlite-admin
      - id: edu-notes
        from: examples/edu-notes
    iframes:
      - id: web-showcase
        from: examples/web-showcase
      - id: wandesk-ui
        from: examples/wandesk-ui
      - id: admin-nextjs
        from: examples/admin-nextjs
      - id: skel-lean-ui
        from: examples/skel-lean-ui

  # ── UC2 集成 iframe app（轨道 B）────────────────────────────
  iframe-one:
    domains: []
    iframes:
      - id: web-showcase
        from: examples/web-showcase

  iframe-two:
    domains: []
    iframes:
      - id: web-showcase
        from: examples/web-showcase
      - id: wandesk-ui
        from: examples/wandesk-ui

  # ── UC3 集成 domain（轨道 A）────────────────────────────────
  domain-one:
    domains:
      - id: admin-tanstack
        from: examples/admin-tanstack
    iframes: []

  domain-two:
    domains:
      - id: admin-tanstack
        from: examples/admin-tanstack
      - id: order-admin
        from: examples/order-admin
    iframes: []

  # ── UC4 domain + iframe 混合 ───────────────────────────────
  mixed:
    domains:
      - id: admin-tanstack
        from: examples/admin-tanstack
    iframes:
      - id: web-showcase
        from: examples/web-showcase

  # ── 其它 ───────────────────────────────────────────────────
  admin:
    domains:
      - id: admin-tanstack
        from: examples/admin-tanstack
    iframes: []

  e2e:
    domains:
      - id: admin-tanstack
        from: examples/admin-tanstack
      - id: order-admin
        from: examples/order-admin
    iframes:
      - id: example-external

  orders:
    domains:
      - id: order-admin
        from: examples/order-admin
    iframes: []

  # ── UC11 教育场景模板（edu 主题 + ink 装饰层）───────────────
  edu:
    domains:
      - id: edu-notes
        from: examples/edu-notes
    iframes: []

  examples:
    domains: []
    iframes:
      - id: skel-lean-ui
        from: examples/skel-lean-ui

  # GitHub Pages：壳内编译全部静态 domain，并准备同源静态 iframe。
  # 不进这个 profile 的是需要服务端的应用：
  #   admin-nextjs  — Next API + Prisma + better-auth
  #   skel-lean-ui  — Playground 依赖 API 路由
  #   sqlite-admin  — 查询本机 SQLite，Pages 上没有数据库
  pages:
    domains:
      - id: admin-tanstack
        from: examples/admin-tanstack
      - id: order-admin
        from: examples/order-admin
      - id: making
        from: examples/making
      - id: awesome
        from: examples/awesome
    iframes:
      - id: web-showcase
        from: examples/web-showcase
      - id: wandesk-ui
        from: examples/wandesk-ui

  sqlite-admin:
    domains:
      - id: sqlite-admin
        from: examples/sqlite-admin
    iframes: []
